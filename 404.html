<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 — Página no encontrada | ASSET</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;750&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: #f5f8fd;
        color: #172337;
        font-family: Manrope, sans-serif;
        display: grid;
        place-items: center;
        padding: 25px;
      }
      main {
        max-width: 530px;
        width: 100%;
        padding: 48px 36px;
        background: #fff;
        border: 1px solid #dfe7f3;
        border-radius: 16px;
        text-align: center;
      }
      img {
        display: block;
        width: 120px;
        height: auto;
        margin: 0 auto 34px;
      }
      .code {
        font-size: 100px;
        letter-spacing: -6px;
        font-weight: 750;
        line-height: 1;
        color: #2563eb;
        margin: 0;
      }
      h1 {
        font-size: 25px;
        letter-spacing: -1px;
        margin: 22px 0 16px;
      }
      p {
        color: #647184;
        font-size: 14px;
        line-height: 1.8;
      }
      a {
        display: inline-flex;
        padding: 14px 22px;
        min-height: 48px;
        align-items: center;
        margin-top: 22px;
        border-radius: 7px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }
      a:hover {
        background: #1c4fca;
      }
      a:focus-visible {
        outline: 3px solid #2563eb;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/assets/asset-logo-horizontal-color.svg"
        alt="ASSET"
        width="120"
        height="30"
      />
      <p class="code">404</p>
      <h1>Esta página no está aquí.</h1>
      <p>
        El enlace puede haber cambiado. Vuelve al inicio para conocer la
        plataforma y encontrar lo que buscas.
      </p>
      <a href="/">Volver al inicio ↗</a>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página no encontrada | ASSET</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #f0f0f5;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      opacity: 0.08;
    }
    .glow-amber { background: #f59e0b; top: -200px; right: -100px; }
    .glow-blue  { background: #2563eb; bottom: -200px; left: -100px; }

    .card {
      position: relative;
      text-align: center;
      max-width: 520px;
      width: 100%;
      background: #111118;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 56px 40px 48px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      color: #f59e0b;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .code {
      font-size: clamp(80px, 18vw, 120px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
      background: linear-gradient(135deg, #f0f0f5 30%, #5a5a72);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f0f0f5;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: #a0a0b4;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      background: #f59e0b;
      color: #0a0a0f;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-primary:hover { background: #d97706; transform: translateY(-1px); }

    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 28px;
      background: transparent;
      color: #a0a0b4;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 15px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, transform 0.15s;
    }
    .btn-secondary:hover {
      border-color: rgba(255,255,255,0.2);
      color: #f0f0f5;
      transform: translateY(-1px);
    }

    .logo {
      position: absolute;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .logo img {
      height: 22px;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="glow glow-amber"></div>
  <div class="glow glow-blue"></div>

  <div class="card">
    <a href="/" class="logo">
      <img src="/assets/asset-logo-horizontal-blanco.svg" alt="ASSET">
    </a>

    <div class="badge">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Error 404
    </div>

    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La URL que buscas no existe o fue movida.<br>Regresa al inicio para continuar.</p>

    <div class="actions">
      <a href="/" class="btn-primary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/>
        </svg>
        Volver al inicio
      </a>
      <a href="/#contacto" class="btn-secondary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Solicitar Demo
      </a>
    </div>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8faff"/>
      <stop offset="100%" style="stop-color:#eef4fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#5285df"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Amber glow blob top-right -->
  <ellipse cx="950" cy="150" rx="320" ry="200" fill="url(#glow)" opacity="0.6"/>

  <!-- Blue glow blob bottom-left -->
  <ellipse cx="200" cy="500" rx="280" ry="180" fill="#2563eb" opacity="0.04"/>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="40" y="40" width="4" height="550" rx="2" fill="url(#accent)"/>

  <!-- Logo badge -->
  <rect x="80" y="80" width="72" height="72" rx="14" fill="#0f172a"/>
  <rect x="80" y="80" width="72" height="72" rx="14" fill="none" stroke="rgba(37,99,235,0.3)" stroke-width="1"/>
  <svg x="86" y="86" width="60" height="60" viewBox="237.2108 183.8354 164.4692 170.3551">
    <path fill="#5FA0FF" d="M237.2136,286.3250 L237.2136,321.1339 L401.6796,252.3040 L401.6796,216.3040 L237.2136,286.3250 Z"/>
    <path fill="#F0F0F5" d="M401.6800,216.8950 L401.6800,251.7030 L322.2240,219.9580 L322.2240,183.8380 L401.6800,216.8950 Z"/>
    <path fill="#E2E2ED" d="M322.2242,317.5464 L322.2242,354.1904 L237.2142,321.1334 L237.2142,286.3254 L322.2242,317.5464 Z"/>
    <path fill="#F0F0F5" d="M401.6800,285.9136 L401.6800,321.9156 L322.2240,354.1906 L322.2240,317.5466 L358.5500,303.0826 L358.5540,303.0826 L401.1810,286.1126 L401.6800,285.9136 Z"/>
    <path fill="#E2E2ED" d="M322.2242,252.4951 L322.2242,287.8801 L237.2142,252.3051 L237.2142,252.1151 L281.7562,235.2671 L322.2242,252.4951 Z"/>
    <path fill="#E2E2ED" d="M322.2238,183.8354 L322.2238,219.9565 L281.7578,235.2654 L237.2108,252.1174 L237.2108,216.1095 L322.2238,183.8354 Z"/>
    <path fill="#F0F0F5" d="M401.6800,286.3250 L401.6800,321.1339 L358.5540,303.0829 L358.5500,303.0829 L322.2240,287.8799 L322.2240,252.4949 L401.1810,286.1129 L401.6800,286.3250 Z"/>
  </svg>

  <!-- ASSET wordmark -->
  <text x="170" y="108" font-family="system-ui, sans-serif" font-weight="800" font-size="32" fill="#192b45" letter-spacing="-0.5">ASSET</text>
  <text x="170" y="132" font-family="system-ui, sans-serif" font-weight="400" font-size="14" fill="#53677f" letter-spacing="0.5">SOFTWARE DE GESTIÓN DE ACTIVOS</text>

  <!-- Divider -->
  <line x1="80" y1="190" x2="1120" y2="190" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Main headline -->
  <text x="80" y="270" font-family="system-ui, sans-serif" font-weight="800" font-size="58" fill="#192b45" letter-spacing="-2">Tus activos,</text>
  <text x="80" y="340" font-family="system-ui, sans-serif" font-weight="800" font-size="58" fill="url(#accent)" letter-spacing="-2">bajo control.</text>

  <!-- Subtext -->
  <text x="80" y="395" font-family="system-ui, sans-serif" font-weight="400" font-size="22" fill="#52667f">Activos, mantenimiento, compras y presupuesto.</text>
  <text x="80" y="423" font-family="system-ui, sans-serif" font-weight="400" font-size="22" fill="#52667f">Para empresas que necesitan claridad.</text>

  <!-- KPI pills -->
  <rect x="80" y="475" width="180" height="44" rx="8" fill="rgba(37,99,235,0.1)" stroke="rgba(37,99,235,0.25)" stroke-width="1"/>
  <text x="170" y="502" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2563eb">Activos e inventario</text>

  <rect x="276" y="475" width="170" height="44" rx="8" fill="rgba(37,99,235,0.1)" stroke="rgba(37,99,235,0.25)" stroke-width="1"/>
  <text x="361" y="502" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2563eb">Mantenimiento</text>

  <rect x="462" y="475" width="160" height="44" rx="8" fill="rgba(37,99,235,0.1)" stroke="rgba(37,99,235,0.25)" stroke-width="1"/>
  <text x="542" y="502" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2563eb">Compras</text>

  <rect x="638" y="475" width="170" height="44" rx="8" fill="rgba(37,99,235,0.1)" stroke="rgba(37,99,235,0.25)" stroke-width="1"/>
  <text x="723" y="502" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2563eb">Reportes</text>

  <!-- URL -->
  <text x="1120" y="565" text-anchor="end" font-family="system-ui, sans-serif" font-weight="400" font-size="16" fill="#53677f">getsmcaf.com</text>
